name: Publish the single-file verifier

# Publishes dist/verifier.html for the network below (#85): on GitHub Pages,
# and attached with its SHA-256 to a release named by that hash, so a
# recipient can check the copy they keep. It does nothing until the network's
# deployment record is committed (#25). docs/operations.md, "The published
# verifier", has the one-time setup.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifier-pages
  cancel-in-progress: false

env:
  # Which registry the published file checks. Moving it to another network is
  # a reviewed change, with that network's endpoints and its re-anchor archives.
  NETWORK: sepolia

jobs:
  build:
    name: Build and release the verifier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The release, and its tag.
      contents: write
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Is there a deployment to publish a verifier for?
        id: gate
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            # A run started by hand from another branch would release code nobody merged.
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only master is published; this run is on $GITHUB_REF."
            echo "Nothing published: only master is, and this run is on $GITHUB_REF." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "deployments/$NETWORK.json" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deployments/$NETWORK.json is not committed yet (#25): there is no registry to publish a verifier for."
            echo "Nothing published: deployments/$NETWORK.json is not committed yet (#25)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.publish == 'true'
        run: npm ci
      - name: Build verifier.html for the network
        if: steps.gate.outputs.publish == 'true'
        env:
          # Public by definition: every copy of the file carries them. Never a keyed URL.
          VERIFY_NETWORK: ${{ env.NETWORK }}
          VERIFY_RPC_URL_1: ${{ vars.VERIFY_RPC_URL_1 }}
          VERIFY_RPC_URL_2: ${{ vars.VERIFY_RPC_URL_2 }}
          APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
          SEAL_TRUST_ANCHORS_PEM: ${{ vars.SEAL_TRUST_ANCHORS_PEM }}
        run: |
          if [ -n "$SEAL_TRUST_ANCHORS_PEM" ]; then
            printf '%s\n' "$SEAL_TRUST_ANCHORS_PEM" > "$RUNNER_TEMP/seal-roots.pem"
            export SEAL_TRUST_ANCHORS="$RUNNER_TEMP/seal-roots.pem"
          fi
          npm run build:verifier
      - name: The site and the release notes
        id: site
        if: steps.gate.outputs.publish == 'true'
        run: |
          npx tsx scripts/verifier-site.ts --out "$RUNNER_TEMP/site" --notes "$RUNNER_TEMP/notes.md"
          (cd "$RUNNER_TEMP/site" && sha256sum -c verifier.html.sha256)
      - name: Release the file with its SHA-256, once per hash
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.site.outputs.tag }}
          RELEASE_URL: ${{ steps.site.outputs.release_url }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already holds this file: no new release." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" "$RUNNER_TEMP/site/verifier.html" "$RUNNER_TEMP/site/verifier.html.sha256" \
              --target "$GITHUB_SHA" --title "Single-file verifier ($NETWORK, ${TAG##*-})" --notes-file "$RUNNER_TEMP/notes.md"
            echo "Released $TAG: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.gate.outputs.publish == 'true'
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
