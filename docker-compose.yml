# Local Postgres for development and the database tests, and Mailpit, which
# catches the mailer's email (SMTP_URL=smtp://127.0.0.1:1025; read it at
# http://127.0.0.1:8025).
#   POSTGRES_PASSWORD=<choose one> docker compose up -d
# Creates two databases: anchor (the app) and anchor_test (npm run test:db).
services:
  postgres:
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: anchor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: anchor
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anchor -d anchor']
      interval: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  pgdata: {}
