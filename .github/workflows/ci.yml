name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_USER: anchor
          POSTGRES_PASSWORD: anchor
          POSTGRES_DB: anchor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anchor -d anchor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # Catches the recipients' email for the end-to-end tests (#56): SMTP on 1025, its API on 8025.
      mailpit:
        image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throwaway databases in a service container that lives for this job: the
      # database tests truncate theirs and leave rows whose files live in their
      # own temporary directory, so the app the end-to-end tests run gets its own.
      TEST_DATABASE_URL: postgresql://anchor:anchor@127.0.0.1:5432/anchor_test
      DATABASE_URL: postgresql://anchor:anchor@127.0.0.1:5432/anchor_e2e
      NEXTAUTH_URL: http://127.0.0.1:3100
      # Stamps and certificates point at <APP_PUBLIC_URL>/verify.
      APP_PUBLIC_URL: http://127.0.0.1:3100
      SEED_ORG_NAME: CI Audit Firm
      SEED_PREPARER_EMAIL: preparer@ci.example
      SEED_APPROVER_EMAIL: approver@ci.example
      SEED_ADMIN_EMAIL: admin@ci.example
      # The mailer sends to Mailpit; the end-to-end tests read what it sent.
      SMTP_URL: smtp://127.0.0.1:1025
      MAIL_FROM: Audit Report Anchoring <noreply@ci.example>
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Throwaway secrets for this run
        run: |
          for name in NEXTAUTH_SECRET FILE_ENCRYPTION_KEY ISSUER_FAMILY_SECRET; do
            value=$(openssl rand -base64 32); echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"
          done
          for name in SEED_PREPARER_PASSWORD SEED_APPROVER_PASSWORD SEED_ADMIN_PASSWORD; do
            value=$(openssl rand -hex 16); echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"
          done
          # The seeded approver and admin sign in with two-step sign-in; the end-to-end tests compute their codes.
          for name in SEED_APPROVER_TOTP_SECRET SEED_ADMIN_TOTP_SECRET; do
            value=$(node -e "const a='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'; console.log([...require('crypto').randomBytes(32)].map((b) => a[b & 31]).join(''))")
            echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"
          done
          echo "FILE_STORAGE_DIR=$RUNNER_TEMP/storage" >> "$GITHUB_ENV"
      - name: Vendored Inflect code matches its manifest
        run: npm run vendor:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Migrations apply from scratch; intake and approval against Postgres
        run: npm run test:db
      - name: Anchoring worker against Postgres and Anvil
        run: npm run test:anchoring
      - name: The end-to-end database, migrated from scratch
        run: |
          psql "$TEST_DATABASE_URL" -qc 'CREATE DATABASE anchor_e2e'
          npx prisma migrate deploy
      - name: Seed the firm's users
        run: npm run db:seed
      - name: A local chain for the end-to-end tests
        run: |
          nohup anvil --port 8545 --chain-id 31337 --slots-in-an-epoch 1 --silent > "$RUNNER_TEMP/anvil.log" 2>&1 &
          for i in $(seq 1 50); do cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break; sleep 0.2; done
          # Fresh keys for this run; Anvil funds them. No key is committed anywhere.
          deployer="0x$(openssl rand -hex 32)"; echo "::add-mask::$deployer"
          issuer="0x$(openssl rand -hex 32)"; echo "::add-mask::$issuer"
          deployer_address=$(cast wallet address --private-key "$deployer")
          issuer_address=$(cast wallet address --private-key "$issuer")
          cast rpc --rpc-url http://127.0.0.1:8545 anvil_setBalance "$deployer_address" 0x16345785D8A0000 > /dev/null
          cast rpc --rpc-url http://127.0.0.1:8545 anvil_setBalance "$issuer_address" 0x8AC7230489E80000 > /dev/null
          # A revocation waits an hour (#95), as it would on a real chain; the end-to-end test moves Anvil's clock past it.
          DEPLOYER_PRIVATE_KEY="$deployer" ISSUER_ADDRESS="$issuer_address" ISSUER_ORG_NAME="$SEED_ORG_NAME" REVOCATION_DELAY_HOURS=1 \
            LOCAL_RPC_URL=http://127.0.0.1:8545 npx tsx scripts/deploy-registry.ts local
          # Finalize the deployment, as a real one long is: the verifier reads the
          # registry's code at the finalized block and refuses a chain without it.
          cast rpc --rpc-url http://127.0.0.1:8545 anvil_mine 0x3 > /dev/null
          {
            echo "ANCHOR_NETWORK=local"
            echo "LOCAL_RPC_URL=http://127.0.0.1:8545"
            echo "ISSUER_ADDRESS=$issuer_address"
            echo "ISSUER_PRIVATE_KEY=$issuer"
          } >> "$GITHUB_ENV"
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: The issuer key is not in the build
        run: |
          if grep -rqF "${ISSUER_PRIVATE_KEY#0x}" .next; then echo "The issuer key appears in .next"; exit 1; fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: The single-file verifier and the CLI, for the local chain
        run: npm run build:verifier
      - name: Tamper suite (the Phase 4 exit gate)
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends qpdf
          npm run test:tamper
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tamper-results
          path: test-results/tamper-results.md
          if-no-files-found: ignore
          retention-days: 30
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Back up, restore into a fresh database, and check the copy (#59)
        run: |
          command -v pg_dump >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          pg_dump --version
          npm run test:backup
      - name: The nightly audit-chain check passes on what the tests wrote
        run: npm run audit:check
      - name: The registry watch finds every write the tests made in the journal (#93)
        run: npm run watch:registry
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pdf:
    name: PDF parsing, golden hashes and fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fixture PDFs reproduce from their generator
        run: npx tsx scripts/gen-pdf-fixtures.ts --check
      - name: Parser, golden and fuzz tests
        run: npm run test:pdf

  golden-windows:
    name: Golden hashes on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Golden tests
        run: npm run test:golden

  contracts:
    name: Contracts and chain adapter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format and lint (Solidity)
        working-directory: contracts
        run: forge fmt --check && forge lint --deny notes
      - name: Unit, fuzz and invariant tests, gas snapshot checked
        working-directory: contracts
        env:
          FORGE_SNAPSHOT_CHECK: 'true'
        run: forge test
      - name: The TypeScript ABI and bytecode match the contract
        run: npm run contracts:artifact && git diff --exit-code src/lib/chain/registry-artifact.ts
      - name: Chain adapter against Anvil
        run: npm run test:integration
      - name: Slither
        working-directory: contracts
        run: |
          pipx install slither-analyzer==0.11.6
          slither . --filter-paths "lib/|test/"

  vendor-reproducible:
    name: Vendored code reproduces from upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Re-derive vendor/inflect-ui from inflect-compliance at the pinned commit
        run: node scripts/sync-inflect-ui.mjs --check

  audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=moderate

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The MIT-licensed gitleaks image, not gitleaks-action (which carries its own EULA).
      - name: Scan the full history
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
