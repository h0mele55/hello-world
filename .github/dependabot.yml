version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 cannot land yet: typescript-eslint, which eslint-config-next
      # pulls in, refuses it on purpose (#80). Lift this once both support it,
      # and check the vendored tree still re-derives from upstream.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The images docker-compose.yml runs locally (Postgres, Mailpit), pinned by digest.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Postgres stays on 16, as CI's service and CLAUDE.md do (owner's decision,
      # 2026-11-12, #174): a 17 or 18 container cannot open a 16 data volume, so a
      # major move is one deliberate PR for compose, CI and the docs together.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
  # forge-std, the contracts' test library.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
